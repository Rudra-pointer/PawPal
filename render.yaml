services:
  - type: web
    name: pawpal
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SEED_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
